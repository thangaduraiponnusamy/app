name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      # No gradle-wrapper.jar is committed, so install the matching Gradle version directly.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.AURUM_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Repository secret AURUM_KEYSTORE_BASE64 is not set"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/aurum-release.jks"
          echo "AURUM_KEYSTORE_PATH=$RUNNER_TEMP/aurum-release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          AURUM_KEYSTORE_PASSWORD: ${{ secrets.AURUM_KEYSTORE_PASSWORD }}
          AURUM_KEY_ALIAS: ${{ secrets.AURUM_KEY_ALIAS }}
          AURUM_KEY_PASSWORD: ${{ secrets.AURUM_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: mv build/outputs/apk/release/app-release.apk "build/outputs/apk/release/aurum-1.0.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: aurum-apk-${{ github.run_number }}
          path: build/outputs/apk/release/aurum-*.apk
          if-no-files-found: error

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/aurum-release.jks"
