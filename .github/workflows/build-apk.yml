name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # The runner image already ships the Android SDK (ANDROID_HOME); no wrapper jar is committed.
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.11.1"

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.AURUM_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::AURUM_KEYSTORE_BASE64 is not set - building a debug APK (uninstall the previous build before installing)."
            echo "BUILD_TYPE=debug" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/aurum-release.jks"
          echo "AURUM_KEYSTORE_PATH=$RUNNER_TEMP/aurum-release.jks" >> "$GITHUB_ENV"
          echo "BUILD_TYPE=release" >> "$GITHUB_ENV"

      - name: Build APK
        env:
          AURUM_KEYSTORE_PASSWORD: ${{ secrets.AURUM_KEYSTORE_PASSWORD }}
          AURUM_KEY_ALIAS: ${{ secrets.AURUM_KEY_ALIAS }}
          AURUM_KEY_PASSWORD: ${{ secrets.AURUM_KEY_PASSWORD }}
        run: |
          if [ "$BUILD_TYPE" = "release" ]; then task=assembleRelease; else task=assembleDebug; fi
          gradle "$task" --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p dist
          cp build/outputs/apk/"$BUILD_TYPE"/*.apk "dist/mybook-1.0.${{ github.run_number }}-$BUILD_TYPE.apk"

      - uses: actions/upload-artifact@v5
        with:
          name: mybook-apk-${{ github.run_number }}
          path: dist/*.apk
          if-no-files-found: error

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/aurum-release.jks"
